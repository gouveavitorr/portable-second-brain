<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Brain — Financeiro</title>
  <link rel="preload" href="/static/fontes/fredoka-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body class="pagina-financeiro">
  <main>
    <header id="cabecalho">
      <div class="linha-topo">
        <span id="mes">financeiro</span>
        <nav id="nav" data-atual="financeiro"></nav>
      </div>
      <div id="totais"></div>

      <div id="caixas-baixo">
        <div id="custos"></div>

        <div id="reserva">
          <div id="reserva-topo">
            <span id="reserva-rot">Reserva de emergência</span>
            <span id="reserva-pct"></span>
          </div>
          <div id="reserva-nums">
            <span id="reserva-val"></span>
            <span id="reserva-meta"></span>
          </div>
          <div id="xp-fundo"><div id="xp-barra"></div></div>
        </div>
      </div>
    </header>

    <div id="grade-fin">
      <section id="receber-sec">
        <h2>Receber <span id="recebimentos-conta" class="conta-sec"></span></h2>
        <ul id="recebimentos" class="linhas-fin"></ul>
        <details id="pausados-wrap">
          <summary>Pausados <span id="pausados-conta"></span></summary>
          <ul id="pausados" class="linhas-fin"></ul>
        </details>
      </section>

      <aside id="pagar-sec">
        <section>
          <h2>Fixos <span id="fixos-conta" class="conta-sec"></span></h2>
          <ul id="fixos" class="linhas-fin"></ul>
        </section>

        <section>
          <h2>Contas <span id="contas-conta" class="conta-sec"></span></h2>
          <ul id="contas" class="linhas-fin"></ul>
        </section>

        <section id="gastos-sec">
          <h2>Gastos</h2>
          <form id="form-gasto">
            <input id="gasto-local" placeholder="onde gastou?" autocomplete="off" required>
            <input id="gasto-valor" type="number" step="0.01" inputmode="decimal" placeholder="R$">
            <button type="submit" id="add-gasto">anotar</button>
          </form>
          <ul id="gastos" class="linhas-fin"></ul>
        </section>
      </aside>
    </div>
  </main>
  <script src="/static/nav.js?v=6"></script>
  <script src="/static/financeiro.js?v=8"></script>
</body>
</html>
